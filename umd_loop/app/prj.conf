# UMD Loop E2 application — enables peripherals + out-of-tree drivers

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Main stack / heap for multi-thread app
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Drivers (Kconfig from umd_loop module; also gated by DT nodes)
CONFIG_UMD_LOOP_RGB_LED=y
CONFIG_UMD_LOOP_SERVO=y
CONFIG_UMD_LOOP_TONE=y
CONFIG_UMD_LOOP_COMMS=y
