description: UMD Loop discrete RGB LED (three GPIO channels)

compatible: "umdloop,rgb-led"

include: base.yaml

properties:
  red-gpios:
    type: phandle-array
    required: true
    description: Red LED GPIO (active high)

  green-gpios:
    type: phandle-array
    required: true
    description: Green LED GPIO (active high)

  blue-gpios:
    type: phandle-array
    required: true
    description: Blue LED GPIO (active high)
